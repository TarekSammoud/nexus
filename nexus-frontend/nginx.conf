

server {
    client_max_body_size 500M;

    location /metrics {
        stub_status on;
        access_log off;
        allow all;
    }
 
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://nexus-backend.backend.svc.cluster.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
	
    location /ws_api/ {
        rewrite ^/ws_api/(.*)$ /$1 break;
        proxy_pass http://nexus-backend.backend.svc.cluster.local:9000;

    # Required for WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recommendation-ai/ {
        rewrite ^/recommendation-ai/(.*)$ /$1 break;
        proxy_pass http://recommendation-ai.ai.svc.cluster.local:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /spam-ai/ {
        rewrite ^/spam-ai/(.*)$ /$1 break;
        proxy_pass http://spam-ai.ai.svc.cluster.local:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /style-ai {
        rewrite ^/style-ai/(.*)$ /$1 break;
        proxy_pass http://style-ai.ai.svc.cluster.local:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    location /support-ai {
        rewrite ^/support-ai/(.*)$ /$1 break;
        proxy_pass http://support-ai.ai.svc.cluster.local:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /toxic-ai {
        rewrite ^/toxic-ai/(.*)$ /$1 break;
        proxy_pass http://toxic-ai.ai.svc.cluster.local:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stub_status {
        stub_status on;
        access_log off;
        allow all;  # Only allow localhost to access (optional, depending on setup)
        deny all;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}

