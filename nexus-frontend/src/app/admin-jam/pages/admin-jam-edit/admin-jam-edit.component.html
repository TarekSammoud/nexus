<div class="admin-edit-container">
    <h2>✏️ Edit Jam: {{ jam.name }}</h2>
  
    <form (ngSubmit)="saveJam()" *ngIf="jam">
      <div class="form-group mb-3">
        <label>Jam Name</label>
        <input [(ngModel)]="jam.name" name="name" class="form-control" required />
      </div>
  
      <div class="form-group mb-3">
        <label>Description</label>
        <textarea [(ngModel)]="jam.description" name="description" class="form-control" required></textarea>
      </div>
  
      <div class="form-group mb-3">
        <label>Image URL</label>
        <input [(ngModel)]="jam.imageUrl" name="imageUrl" class="form-control" />
      </div>
  
      <div class="form-row row mb-3">
        <div class="col">
          <label>Dev Start</label>
          <input type="date" [(ngModel)]="jam.devStartDate" name="devStartDate" class="form-control" required />
        </div>
        <div class="col">
          <label>Dev End</label>
          <input type="date" [(ngModel)]="jam.devEndDate" name="devEndDate" class="form-control" required />
        </div>
      </div>
  
      <div class="form-row row mb-3">
        <div class="col">
          <label>Vote Start</label>
          <input type="date" [(ngModel)]="jam.voteStartDate" name="voteStartDate" class="form-control" />
        </div>
        <div class="col">
          <label>Vote End</label>
          <input type="date" [(ngModel)]="jam.voteEndDate" name="voteEndDate" class="form-control" />
        </div>
      </div>
  
      <div class="form-group mb-4">
        <label>Reward</label>
        <input [(ngModel)]="jam.reward" name="reward" class="form-control" />
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-success me-2">💾 Save</button>
        <button type="button" class="btn btn-outline-light" (click)="cancel()">❌ Cancel</button>
      </div>
    </form>
  </div>
