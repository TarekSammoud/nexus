<div class="page-wrapper" style="display: flex; flex-direction: column; align-items: center; padding: 40px;">
  <h1 class="text-light" style="font-weight: 700; font-size: 50px; margin-bottom: 30px;">
    {{ gameName }}
  </h1>

  <div class="game-container" style="box-shadow: 0 8px 20px rgba(255, 255, 255, 0.9); border-radius: 10px; overflow: hidden;">
    <iframe
      *ngIf="safeGameUrl" 
      [src]="safeGameUrl"
      style="width: 1000px; height: 600px; border: none;"
      frameborder="0"
      scrolling="no"
    ></iframe>
    <div *ngIf="!safeGameUrl">Loading game...</div> <!-- Loading message until game is ready -->
  </div>
</div>
