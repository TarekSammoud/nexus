<div class="entry-form-container">
  <h3 class="form-title">🛍️ Create a Market Listing</h3>

  <form (ngSubmit)="createItem()">
    <div class="form-group">
      <label for="startBid">💰 Start Bid</label>
      <input
        type="number"
        id="startBid"
        [(ngModel)]="market.start_bid"
        name="start_bid"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="endDate">📅 End Date</label>
      <input
        type="datetime-local"
        id="endDate"
        [(ngModel)]="market.end_date"
        name="end_date"
        class="form-control"
        required
      />
    </div>

    <div class="form-group">
      <label for="gameItemId">🎮 Game Item</label>
      <select
        id="gameItemId"
        class="form-control"
        [(ngModel)]="market.game_item_id"
        name="game_item_id"
        required
      >
        <option [ngValue]="null" disabled selected>Select a game item</option>
        <option *ngFor="let item of gameItems" [value]="item.id">
          {{ item.name || ('GameItem #' + item.id) }}
        </option>
      </select>
    </div>

    <button type="submit" class="submit-btn">📦 Create Listing</button>
  </form>
</div>
