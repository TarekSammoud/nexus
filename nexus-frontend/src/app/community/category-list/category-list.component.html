<div class="community-categories-container px-4 py-3">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="title-glow text-light m-0">
      <i class="fas fa-layer-group me-2 text-pink"></i> GESTION DES CATÉGORIES
    </h2>

    <a routerLink="/admin/community/categories/add" class="btn btn-add shadow-sm">
      <i class="fas fa-plus me-2"></i> Nouvelle Catégorie
    </a>
  </div>

  <!-- Table -->
  <div class="table-responsive shadow rounded bg-dark p-3">
    <table class="table table-hover align-middle table-dark category-table">
      <thead class="table-secondary text-dark">
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="fw-bold text-pink">{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>
            <button class="btn btn-sm btn-outline-warning me-2" (click)="editCategory(category.id)">
              ✏️ Modifier
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteCategory(category.id)">
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        <tr *ngIf="categories.length === 0">
          <td colspan="4" class="text-center text-muted py-3">
            <i class="fas fa-info-circle me-2"></i> Aucune catégorie trouvée.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pie Chart Section -->
  <div class="chart-section mt-5 text-center">
    <h3 class="text-light mb-4">
      <i class="fas fa-chart-pie me-2 text-pink"></i> Statistiques des Publications par Catégorie
    </h3>

    <div class="chart-container d-flex justify-content-center">
      <div class="chart-card shadow-lg p-4 rounded bg-dark border border-secondary" style="max-width: 500px; width: 100%;">
        <canvas baseChart
          [data]="pieChartData"
          [type]="'pie'"
          [options]="pieChartOptions"
          style="height: 400px; width: 100%;">
        </canvas>
      </div>
    </div>
  </div>
</div>
