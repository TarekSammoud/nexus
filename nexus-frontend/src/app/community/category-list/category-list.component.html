<div class="community-categories-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="title-glow">
      <i class="fas fa-layer-group me-2"></i> GESTION DES CATÉGORIES
    </h2>

    <a routerLink="/admin/community/categories/add" class="btn btn-add shadow">
      <i class="fas fa-plus me-2"></i> Nouvelle Catégorie
    </a>
  </div>

  <div class="table-responsive shadow rounded">
    <table class="table table-hover align-middle category-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="fw-bold">{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>
            <button class="btn btn-edit me-1" (click)="editCategory(category.id)">
              ✏️ Modifier
            </button>
            <button class="btn btn-delete" (click)="deleteCategory(category.id)">
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        <tr *ngIf="categories.length === 0">
          <td colspan="4" class="text-center text-muted py-3">
            <i class="fas fa-info-circle me-2"></i> Aucune catégorie trouvée.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
