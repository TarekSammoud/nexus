<div class="report-form-container">
  <h2 class="section-title mb-4">
    <i class="fas fa-flag text-danger me-2"></i> Signaler une publication inappropriée
  </h2>

  <p class="section-desc mb-4">
    Utilisez ce formulaire pour signaler une publication que vous jugez offensante, inappropriée ou non conforme aux règles de la communauté.
  </p>

  <div class="report-card p-4 shadow-lg rounded">
    <div class="mb-3">
      <h4 class="text-warning fw-bold"><i class="fas fa-newspaper me-2"></i>{{ publication?.title }}</h4>
      <p class="text-light fst-italic">{{ publication?.content }}</p>
    </div>


    <hr class="border-secondary my-4" />

    <div class="mb-3">
      <label for="reason" class="form-label text-white fw-semibold">
        ✍️ Raison du signalement
      </label>
      <textarea
        id="reason"
        [(ngModel)]="reason"
        class="form-control custom-textarea"
        rows="5"
        placeholder="Expliquez pourquoi cette publication mérite un signalement (ex : langage offensant, spam, contenu inapproprié...)"
      ></textarea>
    </div>
    

    <div class="d-flex justify-content-end mt-4">
      <button class="btn btn-outline-light me-2 px-4 rounded-pill" (click)="router.navigate(['/community'])">
        ❌ Annuler
      </button>
      <button class="btn btn-danger px-4 rounded-pill" (click)="submitReport()">
        🚀 Envoyer le signalement
      </button>
    </div>
  </div>
</div>
