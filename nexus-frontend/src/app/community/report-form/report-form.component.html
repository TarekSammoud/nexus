<div class="container mt-5">
    <h3 class="mb-4 text-danger"><i class="fas fa-flag me-2"></i>Signaler une publication</h3>
  
    <div class="card shadow-sm p-4">
      <h5 class="text-primary mb-3">{{ publication?.title }}</h5>
      <p class="text-muted">{{ publication?.content }}</p>
  
      <label for="reason" class="form-label fw-bold mt-3">Motif du signalement</label>
      <textarea id="reason" class="form-control" rows="4" [(ngModel)]="reason" placeholder="Décrivez la raison..."></textarea>
  
      <div class="mt-4 text-end">
        <button class="btn btn-outline-secondary me-2" (click)="router.navigate(['/community'])">Annuler</button>
        <button class="btn btn-danger" (click)="submitReport()">
          <i class="fas fa-paper-plane me-1"></i>Envoyer
        </button>
      </div>
    </div>
  </div>
