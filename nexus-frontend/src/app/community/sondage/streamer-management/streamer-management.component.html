<div class="streamer-panel">
  <h2 class="panel-title">🎥 Gestion des Streamers</h2>

  <form [formGroup]="streamerForm" (ngSubmit)="onSubmit()" class="streamer-form">
    <div class="row g-3">
      <div class="col-md-3">
        <label>🎙️ Nom du streamer</label>
        <input type="text" class="form-control dark-input" formControlName="name" placeholder="Ex: GamerX" />
      </div>
      <div class="col-md-3">
        <label>📺 Plateforme</label>
        <input type="text" class="form-control dark-input" formControlName="platform" placeholder="Twitch, YouTube..." />
      </div>
      <div class="col-md-4">
        <label>🔗 URL du stream</label>
        <input type="url" class="form-control dark-input" formControlName="streamUrl" placeholder="https://..." />
      </div>
      <div class="col-md-2">
        <label>✅ Disponible ?</label>
        <select class="form-select dark-input" formControlName="available">
          <option [value]="true">Oui</option>
          <option [value]="false">Non</option>
        </select>
      </div>
    </div>

    <div class="text-end mt-3">
      <button type="submit" class="btn btn-primary me-2" [disabled]="streamerForm.invalid">
        {{ editingStreamerId ? '✅ Modifier' : '➕ Ajouter' }}
      </button>
      <button *ngIf="editingStreamerId" type="button" class="btn btn-outline-light" (click)="cancelEdit()">
        ❌ Annuler
      </button>
    </div>
  </form>

  <h4 class="section-subtitle mt-5">📃 Liste des Streamers enregistrés</h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle streamer-table text-center">
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Plateforme</th>
          <th>URL</th>
          <th>Disponibilité</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of streamers">
          <td>{{ s.id }}</td>
          <td>{{ s.name }}</td>
          <td><span class="badge bg-info text-dark">{{ s.platform }}</span></td>
          <td><a [href]="s.streamUrl" target="_blank" class="text-decoration-none">🔗 Voir</a></td>
          <td>
            <span class="badge" [ngClass]="s.available ? 'bg-success' : 'bg-secondary'">
              {{ s.available ? '✅ Oui' : '❌ Non' }}
            </span>            
          </td>
          <td>
            <button class="btn btn-sm btn-outline-warning me-1" (click)="onEdit(s)">✏️</button>
            <button class="btn btn-sm btn-outline-danger" (click)="onDelete(s.id!)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
