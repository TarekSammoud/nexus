
<div class="control-section">
    <ejs-grid #grid [dataSource]='data' height=500 width='auto'>
        <e-columns>
            <e-column headerText='GAME REVIEW LIST' textAlign='Center' field='name' [customAttributes]="{ class: 'e-game-cell' }"></e-column>
        </e-columns>
        <ng-template #rowTemplate let-data>
            <tr >
                <td class="details">
                    <div class="e-game-info-container">
                        <div class="e-game-image-layout">
                            <img class="e-game-image" 
                            [src]="data.coverPicture?.mediaUrl 
                            ? 'http://localhost:9000/nexus-backend/games/upload/download/' + data.game.coverPicture.mediaUrl 
                            : './assets/default-game.jpg'"
                    alt="Game Cover"
                                                alt="{{data.name}}" />
                        </div>
                        <div class="e-game-info-layout">
                            <div class="e-info-text-separator">
                                <span class="e-game-title">User Unknown</span>
                            </div>
                            <div class="e-info-text-separator">
                                <span>{{data.reviewText}}</span>
                            </div>
                            <div class="e-info-text-separator">
                                <span class="e-game-platform">RATING : {{data.rating}}</span>
                            </div>
                            <div class="e-game-price-min-layout e-info-text-separator">
                                <span class="e-game-price-text">Created at:&nbsp;</span>
                                <span class="e-game-price">{{data.createdAt | date}}</span>
                            </div>
                            <div class="e-game-price-min-layout e-info-text-separator">
                                <span class="e-game-price-text">Game :&nbsp;</span>
                                <span class="e-game-price">{{data.game.name}}</span>
                            </div>
                            <button class="btn btn-danger btn-sm" (click)="deleteGameReview(data)">
                                <i class="fas fa-trash-alt me-1"></i>Delete
                            </button>
                        </div>
                        <div class="e-flex-grow"></div>
                    </div>
                </td>
            </tr>
        </ng-template>
    </ejs-grid>
</div>
