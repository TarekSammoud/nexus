<div class="entry-media-form">
  <h4 class="form-heading">📸 Submit Entry Media</h4>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="entryId">🎮 Select Entry</label>
      <select [(ngModel)]="media.entry.id" name="entryId" class="form-select" required>
        <option value="" disabled selected>Select an entry</option>
        <option *ngFor="let entry of entries" [value]="entry.id">
          {{ entry.nameEntry }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="url">🌐 Media URL</label>
      <input type="text" [(ngModel)]="media.url" name="url" class="form-control" placeholder="https://..." required />
    </div>

    <div class="form-group">
      <label for="type">📁 Media Type</label>
      <select [(ngModel)]="media.type" name="type" class="form-select" required>
        <option *ngFor="let type of mediaTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <button type="submit" class="btn btn-media-submit">📤 Submit Media</button>
  </form>
</div>
