<div class="rating-form-popup" *ngIf="!hasAlreadyRated">
  <h5 class="popup-title">🌟 Rate this Entry</h5>
  <form (ngSubmit)="submitRating()">
    <div class="form-group">
      <label>🎨 Graphics</label>
      <input type="range" [(ngModel)]="rating.graphicsScore" name="graphics" min="1" max="10" />
      <span>{{ rating.graphicsScore }}</span>
    </div>

    <div class="form-group">
      <label>🎮 Gameplay</label>
      <input type="range" [(ngModel)]="rating.gameplayScore" name="gameplay" min="1" max="10" />
      <span>{{ rating.gameplayScore }}</span>
    </div>

    <div class="form-group">
      <label>🎵 Music</label>
      <input type="range" [(ngModel)]="rating.musicScore" name="music" min="1" max="10" />
      <span>{{ rating.musicScore }}</span>
    </div>

    <div class="btn-group mt-3">
      <button type="submit" class="btn btn-success">✅ Submit</button>
    </div>
  </form>
</div>

<div *ngIf="hasAlreadyRated" class="text-muted text-center mt-3">
  ✅ You've already rated this entry.
</div>
