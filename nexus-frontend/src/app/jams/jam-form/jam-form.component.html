<div class="jam-form-container">
    <h2 class="form-title">🚀 Create a New Game Jam</h2>
  
    <form (ngSubmit)="createJam()" class="jam-form">
      <div class="form-group">
        <label for="imageUrl">🖼️ Image URL</label>
        <input
          id="imageUrl"
          type="text"
          [(ngModel)]="jam.imageUrl"
          name="imageUrl"
          class="form-control"
          placeholder="Paste an image URL"
        />
      </div>
  
      <div class="form-group">
        <label for="name">📛 Jam Name</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="jam.name"
          name="name"
          class="form-control"
          placeholder="Name of your Game Jam"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="description">📝 Description</label>
        <textarea
          id="description"
          [(ngModel)]="jam.description"
          name="description"
          class="form-control"
          placeholder="What is your jam about?"
          required
        ></textarea>
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label for="devStartDate">📅 Start Date</label>
          <input
            id="devStartDate"
            type="date"
            [(ngModel)]="jam.devStartDate"
            name="devStartDate"
            class="form-control"
            required
          />
        </div>
  
        <div class="form-group">
          <label for="devEndDate">⏳ End Date</label>
          <input
            id="devEndDate"
            type="date"
            [(ngModel)]="jam.devEndDate"
            name="devEndDate"
            class="form-control"
            required
          />
        </div>
      </div>
  
      <div class="form-row">
        <div class="form-group">
          <label for="voteStartDate">🗳️ Vote Start</label>
          <input
            id="voteStartDate"
            type="date"
            [(ngModel)]="jam.voteStartDate"
            name="voteStartDate"
            class="form-control"
            required
          />
        </div>
  
        <div class="form-group">
          <label for="voteEndDate">📥 Vote End</label>
          <input
            id="voteEndDate"
            type="date"
            [(ngModel)]="jam.voteEndDate"
            name="voteEndDate"
            class="form-control"
            required
          />
        </div>
      </div>
  
      <div class="form-group">
        <label for="reward">🏆 Reward (optional)</label>
        <input
          id="reward"
          type="text"
          [(ngModel)]="jam.reward"
          name="reward"
          class="form-control"
          placeholder="Optional reward"
        />
      </div>
  
      <button type="submit" class="form-btn">💾 Create Jam</button>
    </form>
  </div>
