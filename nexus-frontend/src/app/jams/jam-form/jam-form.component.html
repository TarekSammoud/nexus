<div class="jam-form-container">
  <h2 class="form-title">🚀 Create a New Game Jam</h2>

  <form (ngSubmit)="createJam()" class="jam-form">
   

    <div class="form-group">
      <label for="name">📛 Jam Name</label>
      <input
        id="name"
        type="text"
        [(ngModel)]="jam.name"
        (blur)="fetchUnsplashImage()"
        name="name"
        class="form-control"
        placeholder="Name your Game Jam"
        required
      />
    </div>
    
    <div *ngIf="isLoadingImage" class="ai-loading-spinner">
      🤖 AI is imagining your world...
    </div>
    
    <div *ngIf="imagePreview && !isLoadingImage" class="ai-suggestion-box">
      <h4 class="ai-suggestion-title">✨ AI Visual Suggestion ✨</h4>
      <img [src]="imagePreview" alt="AI Suggested Jam Image" class="ai-suggestion-img" />
      <p class="ai-suggestion-note">🔍 Inspired by: <strong>{{ jam.name }}</strong></p>
    </div>
    

    <div class="form-group">
      <label for="description">📝 Description</label>
      <textarea
        id="description"
        [(ngModel)]="jam.description"
        name="description"
        class="form-control"
        placeholder="What is your jam about?"
        required
      ></textarea>
    </div>

<mat-form-field appearance="fill">
  <mat-label>📅 Development Dates</mat-label>
  <mat-date-range-input [rangePicker]="devPicker">
    <input matStartDate placeholder="Start" [(ngModel)]="jam.devStartDate" name="devStartDate">
    <input matEndDate placeholder="End" [(ngModel)]="jam.devEndDate" name="devEndDate">
  </mat-date-range-input>
  <mat-datepicker-toggle matSuffix [for]="devPicker"></mat-datepicker-toggle>
  <mat-date-range-picker #devPicker></mat-date-range-picker>
</mat-form-field>

<mat-form-field appearance="fill">
  <mat-label>🗳️ Voting Dates</mat-label>
  <mat-date-range-input [rangePicker]="votePicker">
    <input matStartDate placeholder="Start" [(ngModel)]="jam.voteStartDate" name="voteStartDate">
    <input matEndDate placeholder="End" [(ngModel)]="jam.voteEndDate" name="voteEndDate">
  </mat-date-range-input>
  <mat-datepicker-toggle matSuffix [for]="votePicker"></mat-datepicker-toggle>
  <mat-date-range-picker #votePicker></mat-date-range-picker>
</mat-form-field>


    <div class="form-group">
      <label for="reward">🏆 Rewardy (optional)</label>
      <input
        id="reward"
        type="text"
        [(ngModel)]="jam.reward"
        name="reward"
        class="form-control"
        placeholder="Optional reward"
      />
    </div>

    <button type="submit" class="form-btn">💾 Create Jam</button>
  </form>
</div>
