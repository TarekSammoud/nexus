
<div class="control-section">
    <div class="button-grid-wrapper">
        <button class="next-btn" (click)="navigateToCreate()">Create Game</button>
    </div>
    <ejs-grid #grid [dataSource]='data' height=500 >
        <e-columns>
            <e-column headerText='GAME LIST' textAlign='Center' field='name' [customAttributes]="{ class: 'e-game-cell' }"></e-column>
        </e-columns>
        <ng-template #rowTemplate let-data>
            <tr>
                <td class="details">
                    <div class="e-game-info-container">
                        <div class="e-game-image-layout">
                            <img class="e-game-image" 
                            [src]="data.gameMediaList.length > 0 ? 'http://localhost:9000/nexus-backend/games/upload/download/' + data.gameMediaList[0].mediaUrl : './assets/default-game.jpg'"
                            alt="{{data.name}}" />

                        </div>
                        <div class="e-game-info-layout">
                            <div class="e-info-text-separator">
                                <span (click)="OnSelect(data)" class="e-game-title">{{data.name}}</span>
                            </div>
                            <div class="e-info-text-separator">
                                <span>{{data.description}}</span>
                            </div>
                            <div class="e-info-text-separator">
                                <span class="e-game-platform">{{data.platforms}}</span>
                            </div>
                            <div class="e-game-price-min-layout e-info-text-separator">
                                <span class="e-game-price-text">Price:&nbsp;</span>
                                <span class="e-game-price">{{data.price | currency}}</span>
                            </div>
                            <div>{{data.createdAt}}</div>
                        </div>
                        <div class="e-flex-grow"></div>
                        <div class="button-container d-flex justify-content-start">
                            <button class="btn btn-warning btn-sm me-2" (click)="editGame(data)">
                                <i class="fas fa-edit me-1"></i>Edit
                            </button>
                            <button class="btn btn-danger btn-sm" (click)="deleteGame(data)">
                                <i class="fas fa-trash-alt me-1"></i>Delete
                            </button>

                            <button class="next-btn" (click)="generateKey(data)">
                                <i class="fas fa-key me-1"></i>
                            </button>
                        </div>
                    </div>
  <!-- Edit and Delete buttons with icons -->

                </td>
            </tr>
        </ng-template>
    </ejs-grid>
</div>
