<div class="d-flex" style="height: 100vh; overflow: hidden;">

  <!-- Sidebar (fixed width) -->
  <div class="sidebar d-flex flex-column bg-dark text-white" style="width: 300px;">

    <!-- Fixed Profile Section -->
    <div class="profile-section text-center d-flex flex-column align-items-center p-4 border-bottom ">
      <img src="assets/img/profilepic.jpg" alt="Admin" class="profile-pic mb-2" style="width: 80px; height: 80px; border-radius: 50%;">
      <div class="text-white fw-semibold">Admin</div>
    </div>

    <!-- Scrollable Links -->
    <div class="flex-grow-1 overflow-auto">
      <div class="dropdown-section">
        <a class="d-flex align-items-center justify-content-between p-3 text-white dropdown-toggle"
           href="javascript:void(0)"
           (click)="toggleGamesDropdown()">
          <span><i class="fas fa-folder-open me-2"></i>Manage Games</span>
          <i class="fas" [ngClass]="{ 'fa-chevron-down': !gamesDropdownOpen, 'fa-chevron-up': gamesDropdownOpen }"></i>
        </a>
      
        <!-- Use Angular's Animation directive -->
        <div *ngIf="gamesDropdownOpen" class="submenu ps-4" [@dropdownAnimation]>
          <a class="d-block py-2 text-white" routerLink="/admin/games/list" routerLinkActive="active"><i class="fas fa-gamepad me-2"></i>Games</a>
          <a class="d-block py-2 text-white" routerLink="/admin/games/categories" routerLinkActive="active"><i class="fas fa-tags me-2"></i>Game Categories</a>
          <a class="d-block py-2 text-white" routerLink="games/keys" routerLinkActive="active"><i class="fas fa-key me-2"></i>Game Keys</a>
          <a class="d-block py-2 text-white" routerLink="/admin/games/reviews" routerLinkActive="active"><i class="fas fa-star me-2"></i>Game Reviews</a>
        </div>
      </div>


      <div class="dropdown-section border-top border-secondary mt-3 pt-3">
        <a class="d-flex align-items-center justify-content-between p-3 text-white dropdown-toggle"
           href="javascript:void(0)"
           (click)="toggleJamDropdown()">
          <span><i class="fas fa-puzzle-piece me-2"></i>Game Jams</span>
          <i class="fas" [ngClass]="{ 'fa-chevron-down': !jamDropdownOpen, 'fa-chevron-up': jamDropdownOpen }"></i>
        </a>

        <div *ngIf="jamDropdownOpen" class="submenu ps-4">
          <a class="d-block py-2 text-white" routerLink="/admin/jams/list" routerLinkActive="active"><i class="fas fa-list me-2"></i>All Jams</a>
          <a class="d-block py-2 text-white" routerLink="/admin/jams/entries" routerLinkActive="active"><i class="fas fa-gamepad me-2"></i>Entries</a>
          <a class="d-block py-2 text-white" routerLink="/admin/jams/media" routerLinkActive="active"><i class="fas fa-photo-video me-2"></i>Media</a>
          <a class="d-block py-2 text-white" routerLink="/admin/jams/ratings" routerLinkActive="active"><i class="fas fa-star-half-alt me-2"></i>Ratings</a>
          <a class="d-block py-2 text-white" routerLink="/admin/jams/vip" routerLinkActive="active"> <i class="fas fa-crown me-2 text-warning"></i>VIP Jam (AI)</a>
        </div>
      </div>
      
      <div class="dropdown-section">
        <a class="d-flex align-items-center justify-content-between p-3 text-white dropdown-toggle"
           href="javascript:void(0)"
           (click)="toggleSupportDropdown()">
          <span><i class="fas fa-folder-open me-2"></i>Manage Support</span>
          <i class="fas" [ngClass]="{ 'fa-chevron-down': !supportDropdownOpen, 'fa-chevron-up': supportDropdownOpen }"></i>
        </a>
      
        <!-- Use Angular's Animation directive -->
        <div *ngIf="supportDropdownOpen" class="submenu ps-4" [@dropdownAnimation]>
          <a class="d-block py-2 text-white" routerLink="/admin/support/list_ticket" routerLinkActive="active"><i class="fas fa-list-alt me-2"></i>List Tickets</a>
          <a class="d-block py-2 text-white" routerLink="/admin/support-agent" routerLinkActive="active"><i class="fas fa-user me-2"></i>Support Agent</a>
          <a class="d-block py-2 text-white" routerLink="/admin/room" routerLinkActive="active"><i class="fas fa-comments me-2"></i>Room</a>
          <a class="d-block py-2 text-white" routerLink="/admin/performance-review" routerLinkActive="active"><i class="fas fa-comments me-2"></i>Performance Review</a>


          <div class="flex-grow-1 overflow-auto">
            <div class="dropdown-section">
              <a class="d-flex align-items-center justify-content-between p-3 text-white dropdown-toggle"
                 href="javascript:void(0)"
                 (click)="toggleDropdownD()">
                 <span><i class="fas fa-folder-open me-2"></i>community</span>
                 <i class="fas" [ngClass]="{ 'fa-chevron-down': !dropdownOpenD, 'fa-chevron-up': dropdownOpenD }"></i>
              </a>
      
              <div *ngIf="dropdownOpenD" class="submenu ps-4">
                <a class="d-block py-2 text-white" routerLink="/admin/community/categories" routerLinkActive="active"><i class="fas fa-image me-2"></i>categories Liste</a>
                <a class="d-block py-2 text-white" routerLink="/admin/community/categories/add" routerLinkActive="active"><i class="fas fa-tags me-2"></i> add categories</a>
                <a class="d-block py-2 text-white" routerLink="/admin/community/reports" routerLinkActive="active"><i class="fas fa-tags me-2"></i> reports</a>
                <a class="d-block py-2 text-white" routerLink="/admin/sondages" routerLinkActive="active"><i class="fas fa-star me-2"></i>sondage liste</a>
                <a class="d-block py-2 text-white" routerLink="/admin/live" routerLinkActive="active"><i class="fas fa-image me-2"></i>live stream</a>
                <a class="d-block py-2 text-white" routerLink="/admin/streamers" routerLinkActive="active"><i class="fas fa-gamepad me-2"></i>streamers</a>
    
        </div>
      </div>
      

      
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-grow-1 p-4 overflow-auto">
    <router-outlet></router-outlet>
  </div>

</div>
