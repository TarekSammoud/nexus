
<div class="">
  <button class="btn" (click)="navigateToDashboard()">Back to dashboard</button>
</div>
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 shadow-lg" style="width: 70vw;">
      <div class="card-body">
        <h4 class="card-title text-center mb-4 text-light">{{title}}</h4>
        <img src="../../assets/img/symbol_only_white.svg" style="width:20px; display:flex; margin-left: auto; margin-right:auto;" alt="">
  
        <form class="background-dark" [formGroup]="gameCategoryForm" (ngSubmit)="onSubmit()">
          <!-- Game Name -->
          <div> 
            
          <div class="form-group">
            <label for="gameName">Name</label>
            <input formControlName="name" type="text" class="form-control" id="gameName" placeholder="Super Mario Bros">
          </div>
  
          <!-- Description -->
          <div class="form-group">
            <label for="description">Description</label>
            <textarea formControlName="description" class="form-control" id="description" rows="3"
              placeholder="Enter game description"></textarea>
          </div>
  
  
        </div>

          <button  type="submit" class="next-btn">Submit</button>
         
          <mat-progress-bar mode="determinate" value="100"></mat-progress-bar>
  
        </form>
      </div>
    </div>
  </div>
