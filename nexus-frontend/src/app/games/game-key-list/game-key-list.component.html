
<div class="control-section">

    <ejs-grid #grid [dataSource]='data' height=500 >
        <e-columns>
            <e-column headerText='GAME KEY LIST' textAlign='Center' field='name' [customAttributes]="{ class: 'e-game-cell' }"></e-column>
        </e-columns>
        <ng-template #rowTemplate let-data>
            <tr>
                <td class="details">
                    <div class="e-game-info-container">
                        <div class="e-game-image-layout">
                            <img class="e-game-image" 
                            [src]="getImageUrl(data)" 
                            alt="{{data.keyCode | uppercase }}" />

                        </div>
                        <div class="e-game-info-layout">
                            <div class="e-info-text-separator">
                                <span  class="e-game-title">{{data.keyCode | uppercase}} <button class="no-style" (click)="copyToClipboard(data.keyCode)"><i class="fa-regular fa-paste" style="color: grey;"></i></button>
                                    [{{data.status}}]</span>
                            </div>
                            <div class="e-info-text-separator">
                                <span>{{data.game.name}}</span>
                            </div>

                            <div class="e-game-price-min-layout e-info-text-separator">
                                <span class="e-game-price-text">Owner:&nbsp;</span>
                                <span class="e-game-price">{{data.user}}</span>
                            </div>
                            <div>GENERATED AT : {{data.createdAt}}</div>
                            <div class="text-danger">EXPIRES AT : {{data.expiresAt}}</div>
                        </div>
                        <div class="e-flex-grow"></div>
                        <div class="button-container d-flex justify-content-start">
             
                            <button class="btn btn-danger btn-sm" (click)="deleteGame(data)">
                                <i class="fas fa-trash-alt me-1"></i>Delete
                            </button>

              
                        </div>
                    </div>
  <!-- Edit and Delete buttons with icons -->

                </td>
            </tr>
        </ng-template>
    </ejs-grid>
</div>
