  <div class="featured-container">
    <div>Emulated Games</div>

    <div class="container py-4">

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" *ngFor="let game of emulatedGames">
          <div (click)="OnSelectEmulated(game)" style="cursor: pointer;" class="card h-100 border-0 shadow-sm game-card">
            <img *ngIf="game.coverPicture" [src]="game.coverPicture?.mediaUrl 
            ? 'http://nexus-backend.backend.svc.cluster.local:9000/nexus-backend/games/upload/download/' + game.coverPicture.mediaUrl 
            : '../../../../assets/img/missing.jpg'" [alt]="game.name" class="card-img-top cover-img" />
            <img *ngIf="!game.coverPicture" src="../../../../assets/img/missing.jpg" class="card-img-top cover-img" />

            <div class="card-body d-flex flex-column justify-content-between">
              <h5 class="text-light " style="text-align: left;">{{ game.name }}</h5>

              <div class="mt-auto">
                <div class="d-flex flex-wrap">
                  <img *ngFor="let platform of game.platforms" class="platform-icon me-2 mb-2"
                    [src]="'assets/images/platforms/' + (platform | uppercase) + '.svg'" [alt]="platform" width="24"
                    height="24" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>



  </div>


  <div class="featured-container">
    <div>HTML5 Games</div>

    <div class="container py-4">

      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" *ngFor="let game of browserGames">
          <div (click)="OnSelectBrowser(game)" style="cursor: pointer;" class="card h-100 border-0 shadow-sm game-card">
            <img *ngIf="game.coverPicture" [src]="game.coverPicture?.mediaUrl 
            ? 'http://nexus-backend.backend.svc.cluster.local:9000/nexus-backend/games/upload/download/' + game.coverPicture.mediaUrl 
            : '../../../../assets/img/missing.jpg'" [alt]="game.name" class="card-img-top cover-img" />
            <img *ngIf="!game.coverPicture" src="../../../../assets/img/missing.jpg" class="card-img-top cover-img" />

            <div class="card-body d-flex flex-column justify-content-between">
              <h5 class="text-light " style="text-align: left;">{{ game.name }}</h5>

              <div class="mt-auto">
                <div class="d-flex flex-wrap">
                  <img *ngFor="let platform of game.platforms" class="platform-icon me-2 mb-2"
                    [src]="'assets/images/platforms/' + (platform | uppercase) + '.svg'" [alt]="platform" width="24"
                    height="24" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>



  </div>


</div>
