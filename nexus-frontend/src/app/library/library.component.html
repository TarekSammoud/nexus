<div class="container py-4">
    <br>
    <h1 class="text-light" style="font-weight: 700; font-size: 50px;">Game Library</h1>
  <br>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div class="col" *ngFor="let game of games">
        <div class="card h-100 border-0 shadow-sm game-card">
          <img  *ngIf="game.coverPicture"  [src]="game.coverPicture?.mediaUrl 
          ? 'http://localhost:9000/nexus-backend/games/upload/download/' + game.coverPicture.mediaUrl 
          : './assets/default-game.jpg'" [alt]="game.name" class="card-img-top cover-img" />
  
          <div class="card-body d-flex flex-column justify-content-between">
            <h5 class="text-light">{{ game.name }}</h5>
  
            <div class="mt-auto">
              <div class="d-flex flex-wrap">
                <img
                  *ngFor="let platform of game.platforms"
                  class="platform-icon me-2 mb-2"
                  [src]="'assets/images/platforms/' + (platform | uppercase) + '.svg'"
                  [alt]="platform"
                  width="24"
                  height="24"
                />
              </div>
              <div><i class="fas fa-download"></i> <a  (click)="downloadFile(game)" class="text-muted" style="text-decoration: none; cursor:pointer;"> Download</a></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
