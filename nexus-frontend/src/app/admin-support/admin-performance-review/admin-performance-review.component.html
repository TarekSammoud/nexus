
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>

            <th>Support Agent ID</th>
            <th>Rating</th>
            <th>Feedback</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let review of reviews$ | async">
            <td>{{ review.supportAgentId }}</td>
            <td>
              <span class="badge"
                    [ngClass]="{
                      'bg-success': review.rating >= 4,
                      'bg-warning text-dark': review.rating === 3,
                      'bg-danger': review.rating <= 2
                    }">
                {{ review.rating }}
              </span>
            </td>
            <td>{{ review.feedback }}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-sm btn-outline-danger" (click)="deleteReview(review.id ?? 0)">
                  <i class="bi bi-trash"></i> Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  


  
  <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">
    <label for="rating">Rating:</label>
    <input id="rating" formControlName="rating" type="number">
  
    <label for="feedback">Feedback:</label>
    <textarea id="feedback" formControlName="feedback"></textarea>
  
    <button type="submit" [disabled]="reviewForm.invalid">
      {{ currentReview ? 'Update Review' : 'Add Review' }}
    </button>
  </form>
