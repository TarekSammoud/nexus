<app-header></app-header>

<div>
    <label for="recipient">Choisir un ami :</label>
    <select [(ngModel)]="recipientId" id="recipient">
        <option *ngFor="let friend of friends" [value]="friend.id">
            {{ friend.firstName }} {{ friend.lastName }}
        </option>
    </select>
</div>

<!-- Affichage des messages -->
<div *ngFor="let msg of messages"
    [ngClass]="{ 'sent': msg.senderId === currentUserId, 'received': msg.senderId !== currentUserId }">
    <div class="message">
        <strong>{{ msg.senderId === currentUserId ? 'Moi' : msg.senderId }}:</strong>
        <p>{{ msg.content }}</p>
    </div>
</div>

<!-- Zone de saisie du message -->
<textarea [(ngModel)]="messageContent" placeholder="Votre message ici..."></textarea>
<button (click)="sendMessage()">Envoyer</button>

<!-- Style CSS pour la séparation des messages envoyés et reçus -->
<style>
    .message {
        display: inline-block;
        max-width: 60%;
        word-wrap: break-word;
        padding: 10px;
        border-radius: 5px;
        margin: 5px 0;
    }

    textarea {
        width: 100%;
        height: 80px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin-top: 10px;
    }

    button {
        margin-top: 10px;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #45a049;
    }
</style>
