<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow">
                <h2 class="text-center mb-4">Sign Up</h2>
                <form (ngSubmit)="onSubmit()" #signupForm="ngForm">

                    <!-- First Name -->
                    <div class="mb-3">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Enter your first name"
                            [(ngModel)]="user.firstName" name="firstName" required #firstName="ngModel">
                        <div *ngIf="firstName.invalid && firstName.touched" class="text-danger">
                            First name is required.
                        </div>
                    </div>

                    <!-- Last Name -->
                    <div class="mb-3">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Enter your last name"
                            [(ngModel)]="user.lastName" name="lastName" required #lastName="ngModel">
                        <div *ngIf="lastName.invalid && lastName.touched" class="text-danger">
                            Last name is required.
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email"
                            [(ngModel)]="user.email" name="email" required email #email="ngModel">
                        <div *ngIf="email.invalid && email.touched" class="text-danger">
                            A valid email is required.
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password"
                            [(ngModel)]="user.password" name="password" required minlength="6" #password="ngModel">
                        <div *ngIf="password.invalid && password.touched" class="text-danger">
                            Password is required and must be at least 6 characters long.
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber" placeholder="Enter your phone number"
                            [(ngModel)]="user.phoneNumber" name="phoneNumber" pattern="^[0-9]{10}$"
                            #phoneNumber="ngModel">
                        <div *ngIf="phoneNumber.invalid && phoneNumber.touched" class="text-danger">
                            Phone number should be 10 digits long (optional).
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter your address"
                            [(ngModel)]="user.address" name="address" #address="ngModel">
                    </div>

                    <!-- Role -->
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-control" id="role" [(ngModel)]="user.role" name="role" required
                            #role="ngModel">
                            <option value="DEVELOPER">Developer</option>
                            <option value="PLAYER">Player</option>
                        </select>
                        <div *ngIf="role.invalid && role.touched" class="text-danger">
                            Role is required.
                        </div>
                    </div>

                    <!-- Profile Pictures (Optional) -->
                    <div class="mb-3">
                        <label for="profilePictures" class="form-label">Profile Pictures (Optional)</label>
                        <input type="file" class="form-control" id="profilePictures" multiple
                            [(ngModel)]="user.profilePictures" name="profilePictures">
                    </div>

                    <button type="submit" class="btn btn-primary w-100" [disabled]="signupForm.invalid">Sign Up</button>
                </form>

                <div class="text-center mt-3">
                    <a routerLink="/login" class="btn btn-link">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
