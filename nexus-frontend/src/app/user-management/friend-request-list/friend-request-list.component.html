<app-header></app-header>
<div class="container mt-4">
    <!-- SECTION 1 : Joueurs recommandés -->
    <div class="row">
        <!-- SECTION 1 : Joueurs recommandés -->
        <div class="row">
            <div class="col-md-6">
                <h2>Joueurs recommandés</h2>

                <div *ngIf="isLoading" class="text-center">
                    <p>Chargement des joueurs recommandés...</p>
                </div>

                <div *ngIf="!isLoading && recommendedFriends.length === 0" class="text-center">
                    <p>Aucun joueur recommandé pour le moment.</p>
                </div>

                <div *ngIf="!isLoading && recommendedFriends.length > 0">
                    <div *ngFor="let player of recommendedFriends" class="card mb-3">
                        <div class="card-body d-flex align-items-center">
                            <img [src]="imageUrls[player.id] || '../../assets/img/profilepic.jpg'" alt="Profile"
                                class="profile-img rounded-circle" width="50" height="50">
                            <div class="ms-3">
                                <h5 class="card-title">{{ player.firstName }} {{ player.lastName }}</h5>
                                <p class="mb-0 text-muted" *ngIf="player.mutualFriendsCount > 0">
                                    {{ player.mutualFriendsCount }} ami(s) en commun
                                </p>
                            </div>
                            <button class="btn btn-primary ms-auto" (click)="sendFriendRequest(player.id)">
                                Ajouter
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION 2 : Invitations reçues -->
        <div class="col-md-6">
            <h2>Invitations reçues</h2>

            <div *ngIf="receivedRequests.length === 0" class="text-center">
                <p>Aucune invitation reçue.</p>
            </div>

            <div *ngIf="receivedRequests.length > 0">
                <div *ngFor="let req of receivedRequests" class="card mb-3">
                    <div class="card-body d-flex align-items-center">
                        <img [src]="imageUrls[req.sender.id] || '../../assets/img/profilepic.jpg'" alt="Profile"
                            class="profile-img rounded-circle" width="50" height="50">
                        <div class="ms-3">
                            <h5 class="card-title">{{ req.sender.firstName }} {{ req.sender.lastName }}</h5>
                        </div>
                        <div class="ms-auto d-flex gap-2">
                            <button class="btn btn-success"
                                (click)="acceptRequest(req.idFriendRequest)">Accepter</button>
                            <button class="btn btn-danger" (click)="rejectRequest(req.idFriendRequest)">Rejeter</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
