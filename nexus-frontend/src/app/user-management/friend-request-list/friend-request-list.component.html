<app-header></app-header>

<div class="container mt-4">
    <h2>Available Players for Friend Request</h2>

    <!-- Affichage pendant le chargement -->
    <div *ngIf="isLoading" class="text-center">
        <p>Loading available players...</p>
    </div>

    <!-- Affichage des joueurs disponibles -->
    <div *ngIf="!isLoading && availablePlayers.length === 0" class="text-center">
        <p>No available players for friend request.</p>
    </div>

    <div *ngIf="!isLoading && availablePlayers.length > 0">
        <div *ngFor="let player of availablePlayers" class="card mb-3">
            <div class="card-body d-flex align-items-center">
                <img [src]="imageUrls[player.id] || '../../assets/img/profilepic.jpg'" alt="Profile"
                    class="profile-img rounded-circle" width="50" height="50">

                <div class="ms-3">
                    <h5 class="card-title">{{ player.firstName }} {{ player.lastName }}</h5>
                </div>
                <button class="btn btn-primary ms-auto" (click)="sendFriendRequest(player.id)">
                    Send Friend Request
                </button>
            </div>
        </div>
    </div>
</div>
