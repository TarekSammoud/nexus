<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <hr />
            <div class="text-center mt-4">
                <h4 class="text-light">Photo de profil</h4>

                <!-- Indicateur de chargement -->
                <div *ngIf="isLoading" class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>

                <!-- Conteneur pour l'image et l'avatar animé -->
                <div class="d-flex justify-content-center align-items-center">
                    <!-- Avatar animé affiché à gauche -->
                    <div class="position-relative me-3">
                        <video *ngIf="animationResult?.data?.videoUrl" [src]="animationResult.data.videoUrl" autoplay
                            muted loop class="position-absolute"
                            style="top: 0; left: 0; width: 200px; z-index: 2; border-radius: 10px;">
                        </video>

                    </div>

                    <!-- Image de profil affichée à droite -->
                    <div class="position-relative">
                        <img [src]="imageUrl" alt="Profile Picture" class="img-thumbnail"
                            style="max-width: 200px; z-index: 1; border-radius: 10px;" />
                    </div>
                </div>

                <ng-template #noImage>
                    <p>Aucune photo disponible.</p>
                </ng-template>

                <!-- Bouton pour demander la génération de l'avatar animé -->
                <div class="mt-3">
                    <button class="btn btn-primary" (click)="uploadToFaceAnimer()">Générer l'avatar animé</button>
                </div>
            </div>

            <!-- Détails du profil utilisateur -->
            <div class="card shadow p-4 mt-4">
                <h2 class="text-center">User Profile</h2>

                <div *ngIf="user">
                    <h4>Profile Details:</h4>
                    <ul class="list-group">
                        <li class="list-group-item">
                            <strong>Email:</strong> {{ user.email }}
                        </li>
                        <li class="list-group-item">
                            <strong>Phone:</strong> {{ user.phoneNumber }}
                        </li>
                        <li class="list-group-item">
                            <strong>Address:</strong> {{ user.address }}
                        </li>
                        <li class="list-group-item">
                            <strong>Created At:</strong> {{ user.createdAt | date }}
                        </li>
                    </ul>
                </div>

                <div *ngIf="errorMessage" class="text-danger mt-3">
                    {{ errorMessage }}
                </div>
            </div>
        </div>
    </div>
</div>
