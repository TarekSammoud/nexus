<div class="container">
    <h1>Générateur d'avatar</h1>

    <form (ngSubmit)="generateAvatar()">
        <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput [(ngModel)]="model.description" name="description" required></textarea>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Style artistique</mat-label>
            <mat-select [(ngModel)]="model.artStyle" name="artStyle">
                <mat-option *ngFor="let style of artStyles" [value]="style.value">
                    {{style.display}}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Traits du visage</mat-label>
            <mat-select [(ngModel)]="model.facialFeatures" name="facialFeatures" multiple>
                <mat-option *ngFor="let feature of facialFeatures" [value]="feature.value">
                    {{feature.display}}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Éléments à éviter</mat-label>
            <input matInput [(ngModel)]="model.negativePrompt" name="negativePrompt">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">Générer l'avatar</span>
            <span *ngIf="isLoading">Génération en cours...</span>
        </button>
    </form>
    <div *ngIf="generatedImageUrl">
        <h3>Generated Avatar:</h3>
        <img [src]="generatedImageUrl" alt="Generated Avatar" style="max-width: 300px;">
    </div>

</div>
