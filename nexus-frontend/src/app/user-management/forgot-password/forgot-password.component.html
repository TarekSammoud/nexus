<!-- Typewriter animation at the top -->
<div class="typewriter-container typewriter-large mb-4">
    <p class="typewriter-text">Reset your password 🔐</p>
</div>


<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4 text-center">Forgot Password</h2>

        <!-- Step 1: Send OTP -->
        <div *ngIf="step === 1">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control" [(ngModel)]="email" type="email" required />
            </div>
            <button class="btn btn-primary w-100" (click)="onSendOtp()">Send OTP by Email</button>
        </div>

        <!-- Step 2: Verify OTP and enter new password -->
        <div *ngIf="step === 2">
            <div class="mb-3">
                <label for="otp" class="form-label">OTP Code</label>
                <input id="otp" class="form-control" [(ngModel)]="otp" required />
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input id="newPassword" class="form-control" [(ngModel)]="newPassword" type="password" required />
            </div>
            <button class="btn btn-success w-100" (click)="onResetPassword()">Reset Password</button>
        </div>

        <!-- Step 3: Confirmation -->
        <div *ngIf="step === 3" class="alert alert-success mt-3 text-center">
            {{ message }}
        </div>

        <div *ngIf="message && step !== 3" class="alert alert-info mt-3">{{ message }}</div>
        <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
    </div>
</div>
