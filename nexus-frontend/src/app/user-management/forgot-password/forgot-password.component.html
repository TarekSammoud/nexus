<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4 text-center">Mot de passe oublié</h2>

        <div *ngIf="step === 1">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" class="form-control" [(ngModel)]="email" type="email" required />
            </div>
            <button class="btn btn-primary w-100" (click)="onSendOtp()">Envoyer le code par SMS</button>
        </div>

        <div *ngIf="step === 2">
            <div class="mb-3">
                <label for="otp" class="form-label">Code OTP</label>
                <input id="otp" class="form-control" [(ngModel)]="otp" required />
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                <input id="newPassword" class="form-control" [(ngModel)]="newPassword" type="password" required />
            </div>
            <button class="btn btn-success w-100" (click)="onResetPassword()">Réinitialiser</button>
        </div>

        <div *ngIf="step === 3" class="alert alert-success mt-3 text-center">
            {{ message }}
        </div>

        <div *ngIf="message && step !== 3" class="alert alert-info mt-3">{{ message }}</div>
        <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
    </div>
</div>
