<div class="cart-container">
  <div class="cart-header">
    <h2>My Cart</h2>
    <span class="items-count">{{ cartItems.length }} article(s)</span>
  </div>

  <div class="cart-layout" *ngIf="cartItems.length > 0">
    <!-- Left Side: Cart Items -->
    <div class="cart-items-section">
      <div class="cart-item" *ngFor="let item of cartItems; let i = index" 
           [ngStyle]="{'animation-delay': i * 0.1 + 's'}">
        <div class="item-image">
          <img [src]="item.coverPicture?.mediaUrl 
            ? 'http://nexus-backend.backend.svc.cluster.local:9000/nexus-backend/games/upload/download/' + item.coverPicture?.mediaUrl 
            : '../../../../assets/img/missing.jpg'"
            [alt]="item.name" class="result-img" />        </div>
        <div class="item-details">
          <h3>{{ item.name }}</h3>
          <button class="remove-btn" (click)="removeItem(item.id)">
            <i class="fas fa-times"></i>
            Remove
          </button>
        </div>
        <div class="item-price">
          <span>{{ item.price }}</span>
          <img src="../../assets/img/token.png" alt="Token" class="token-icon">
        </div>
      </div>
    </div>

    <!-- Right Side: Checkout Summary -->
    <div class="checkout-section">
      <div class="summary-box">
        <h3>Order Summary</h3>
        <div class="summary-row total">
          <span>Total</span>
          <div class="total-amount">
            <span>{{ total }}</span>
            <img src="../../assets/img/token.png" alt="Token" class="token-icon">
          </div>
        </div>
        <button class="checkout-btn" (click)="checkout()">
          Proceed to Purchase
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Empty Cart Message -->
  <div class="empty-cart" *ngIf="cartItems.length === 0">
    <i class="fas fa-shopping-cart"></i>
    <p>Your cart is empty</p>
    <button routerLink="/products" class="continue-btn">
      Continue Shopping
    </button>
  </div>
</div>
