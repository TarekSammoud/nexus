<!-- payment.component.html -->
<div class="overflow-auto" style="height: 400px;">


  <!-- Payments List -->
  <div *ngFor="let payment of payments; ">
    <div class="card m-2 w-90">
      <div class="row g-0">
        <!-- Content Column -->
        <div class="col-md-11">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="d-flex align-items-center gap-4">
                <h5 class="card-title mb-0">ID: {{ payment.id }}</h5>
                <!-- Status badge -->
                <span *ngIf="payment.status === 'Completed'" class="badge badge-Completed">
                  <i class="fas fa-check me-1"></i>Completed
                </span>
                <span *ngIf="payment.status === 'Pending'" class="badge badge-Pending">
                  <i class="fas fa-clock me-1"></i>Pending
                </span>
                <span *ngIf="payment.status === 'Failed'" class="badge badge-Failed">
                  <i class="fas fa-times me-1"></i>Failed
                </span>
              </div>
              <div class="d-flex align-items-center gap-4">
                <h5 class="card-title price-tag eth mb-0">
                  <i class="fab fa-ethereum"></i>
                  {{ payment.price }} ETH
                </h5>
                <h5 class="card-title price-tag coins mb-0">
                  <img src="../../assets/img/token.png" alt="Coins" class="coin-icon">
                  {{ payment.coinAmount }} coins
                </h5>
              </div>
            </div>

            <div class="d-flex justify-content-start align-items-center">
              <span class="date-info">
                <i class="far fa-calendar-alt me-2"></i>
                {{ payment.updatedAt | date:'dd MMM yyyy HH:mm' }}
              </span>
            </div>
          </div>
        </div>

        <!-- Delete Button Column -->
        <div class="col-md-1 d-flex justify-content-center align-items-center">
          <button class="btn btn-link delete-btn" data-bs-toggle="modal" data-bs-target="#deleteModal"
            (click)="setSelectedPayment(payment.id)">
            <i class="far fa-trash-can fa-2x"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete payment with ID: <strong>{{ selectedPaymentId }}</strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteItem(selectedPaymentId)" data-bs-dismiss="modal">Delete</button>
      </div>
    </div>
  </div>
</div>
