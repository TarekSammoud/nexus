<!-- purchase.component.html -->
<div class="overflow-auto" style="height: 400px;">


  <!-- Purchases List -->
  <div *ngFor="let purchase of purchases; ">
    <div class="card m-2 w-90">
      <div class="row g-0">
        <!-- Content Column -->
        <div class="col-md-11">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="d-flex align-items-center gap-4">
                <h5 class="card-title mb-0">ID: {{ purchase.id }}</h5>
                <span class="product-type" [ngClass]="{'game-type': isGameType(purchase.productType), 'item-type': !isGameType(purchase.productType)}">
                  <i [class]="isGameType(purchase.productType) ? 'fas fa-gamepad' : 'fas fa-puzzle-piece'"></i>
                 
                </span>
              </div>
              <h5 class="card-title price-tag mb-0">
                <img src="../../assets/img/token.png" alt="Coins" class="coin-icon">
                {{ purchase.price }} coins
              </h5>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <div class="purchase-details">
                <span class="product-id">Product ID: {{ purchase.productId }}</span>
                <span class="date-info ms-4">
                  <i class="far fa-calendar-alt me-2"></i>
                  {{ purchase.createdAt | date:'dd MMM yyyy HH:mm' }}
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Delete Button Column -->
        <div class="col-md-1 d-flex justify-content-center align-items-center">
          <button class="btn btn-link delete-btn" data-bs-toggle="modal" data-bs-target="#deletePurchaseModal"
            (click)="setSelectedPurchase(purchase.id!)">
            <i class="far fa-trash-can fa-2x"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deletePurchaseModal" tabindex="-1" aria-labelledby="deletePurchaseModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deletePurchaseModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete purchase with ID: <strong>{{ selectedPurchaseId }}</strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteItem(selectedPurchaseId)" data-bs-dismiss="modal">Delete</button>
      </div>
    </div>
  </div>
</div>
