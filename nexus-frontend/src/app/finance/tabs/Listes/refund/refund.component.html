<!-- refund.component.html -->
<div class="overflow-auto" style="height: 400px;">
    <div *ngFor="let refund of refunds">
      <div class="card m-2 w-90">
        <div class="row g-0">
          <!-- Content Column -->
          <div class="col-md-11">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center gap-4">
                  <h5 class="card-title mb-0">ID: {{ refund.id }}</h5>
                  <!-- Status badge -->
                  <span *ngIf="refund.status === 'Accepted'" class="badge badge-Completed">
                    <i class="fas fa-check me-1"></i>Accepted
                  </span>
                  <span *ngIf="refund.status === 'Pending'" class="badge badge-Pending">
                    <i class="fas fa-clock me-1"></i>Pending
                  </span>
                  <span *ngIf="refund.status === 'Failed'" class="badge badge-Failed">
                    <i class="fas fa-times me-1"></i>Failed
                  </span>
                </div>
                <h5 class="card-title price-tag coins mb-0">
                  <img src="../../assets/img/token.png" alt="Coins" class="coin-icon">
                  {{ refund.refundAmount }} coins
                </h5>
              </div>
  
              <div class="d-flex justify-content-start align-items-center gap-4">
                <span class="purchase-id">
                  Purchase ID: {{ refund.purchase?.id || 'No purchase' }}
                </span>
                <span class="date-info">
                  <i class="far fa-calendar-alt me-2"></i>
                  {{ refund.createdAt | date:'dd MMM yyyy HH:mm' }}
                </span>
              </div>
  

            </div>
          </div>
  
          <!-- Delete Button Column -->
          <div class="col-md-1 d-flex justify-content-center align-items-center">
            <button class="btn btn-link delete-btn" data-bs-toggle="modal" data-bs-target="#deleteRefundModal"
              (click)="refund.id !== undefined && setSelectedRefund(refund.id)">
              <i class="far fa-trash-can fa-2x"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteRefundModal" tabindex="-1" aria-labelledby="deleteRefundModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteRefundModalLabel">Confirm Deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete refund with ID: <strong>{{ selectedRefundId }}</strong>?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" (click)="deleteItem(selectedRefundId)" data-bs-dismiss="modal">Delete</button>
        </div>
      </div>
    </div>
  </div>
