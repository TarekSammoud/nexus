<div class="modal-header">
    <h5 class="modal-title">
      <i class="fas fa-tasks me-2"></i>Available Tasks
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
  </div>
  
  <!-- Filter Section -->
  <div class="modal-subheader">
    <div class="filter-section">
      <label for="rewardSort" class="form-label">Sort by Rewards:</label>
      <select class="form-select" id="rewardSort" [(ngModel)]="sortOrder" (change)="sortTasks(sortOrder)">
        <option value="high-low">Highest to Lowest Rewards</option>
        <option value="low-high">Lowest to Highest Rewards</option>
      </select>
    </div>
  </div>
  
  <div class="modal-body">
    <!-- Task List -->
    <div class="task-list">
      <!-- Task Item -->
      <div class="task-item" *ngFor="let task of filteredTasks">
        <div class="task-info">
          <img [src]="task.gameImage" [alt]="task.gameName" class="game-image">
          <div class="game-details">
            <h6>{{task.gameName}}</h6>
          </div>
          <div class="reward-info">
            <i class="fas fa-coins"></i>
            <span class="reward-amount">{{task.rewardCoins}}</span>
            <span class="coins-text">coins</span>
          </div>
        </div>
        <button class="btn btn-primary buy-btn" (click)="buyTask(task.id)">
          <i class="fas fa-shopping-cart"></i>
          Buy
        </button>
      </div>
    </div>
  </div>
