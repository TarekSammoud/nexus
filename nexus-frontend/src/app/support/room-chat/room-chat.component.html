<div class="chat-container" aria-label="Chat Window">
  <div class="header">
    <button (click)="closeChat()" class="close-chat-button" [disabled]="chatClosed" aria-label="Close Chat">Close Chat</button>
  </div>
  <div class="message-list" role="log" aria-live="polite">
    <div *ngFor="let message of messages" class="message-item">
      <strong>{{ message.sender }}:</strong> {{ message.content }}
    </div>
  </div>
  <div class="message-input">
    <input [(ngModel)]="newMessage" placeholder="Type a message" [disabled]="chatClosed" aria-label="Type your message here" />
    <button (click)="sendMessage()" [disabled]="sending || chatClosed" aria-label="Send Message">Send</button>
  </div>
</div>
