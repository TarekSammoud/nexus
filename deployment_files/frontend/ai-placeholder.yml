---
apiVersion: v1
kind: Namespace
metadata:
  name: ai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-ai-html-config
  namespace: ai
data:
  index.html: |
    <html>
      <body>
        <h1>Recommendation AI Service Placeholder</h1>
        <p>This is a placeholder for the Recommendation AI service.</p>
      </body>
    </html>

---
