        <h1>Toxic AI Service Placeholder</h1>
        <p>This is a placeholder for the Toxic AI service.</p>
      </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-ai
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-ai
  template:
    metadata:
      labels:
        app: recommendation-ai
    spec:
      containers:
        - name: recommendation-ai
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: ai-html
      volumes:
        - name: ai-html
          configMap:
            name: recommendation-ai-html-config

---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-ai
  namespace: ai
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: recommendation-ai
