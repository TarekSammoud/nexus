apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-frontend
  namespace: frontend
spec:
  selector:
    matchLabels:
      app: nexus-frontend
  template:
    metadata:
      labels:
        app: nexus-frontend
    spec:
      containers:
        - name: frontend
          image: tareksammoud/nexus-frontend
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-frontend
  namespace: frontend
spec:
  selector:
    app: nexus-frontend
  ports:
    - port: 4200
      targetPort: 80
