apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-frontend
  namespace: frontend
  labels:
    app: nexus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-frontend
  template:
    metadata:
      labels:
        app: nexus-frontend
    spec:
      containers:
      - name: nexus-frontend
        image: tareksammoud/nexus-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://nexus-backend.backend.svc.cluster.local:9000"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-frontend
  namespace: frontend
spec:
  selector:
    app: nexus-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
