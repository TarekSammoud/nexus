apiVersion: v1
kind: Namespace
metadata:
  name: ftp

---

# PersistentVolume (optional, only if not using dynamic provisioning)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ftp-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:  # Use hostPath for local clusters only
    path: /mnt/data/ftp
  persistentVolumeReclaimPolicy: Retain

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ftp-pvc
  namespace: ftp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: ftp-pv  # Bind to the above PV

---

apiVersion: v1
kind: Secret
metadata:
  name: ftp-auth
  namespace: ftp
type: Opaque
stringData:
  FTP_USER: nexus-ftp
  FTP_PASSWORD: "123456789"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: ftp-config
  namespace: ftp
data:
  vsftpd.conf: |
    listen=YES
    anonymous_enable=NO
    local_enable=YES
    write_enable=YES
    local_umask=022
    dirmessage_enable=YES
    use_localtime=YES
    xferlog_enable=YES
    connect_from_port_20=YES
    chroot_local_user=YES
    secure_chroot_dir=/var/run/vsftpd/empty
    pasv_enable=YES
    pasv_min_port=30000
    pasv_max_port=30009
    pasv_address=127.0.0.1
    user_sub_token=$USER
    local_root=/home/$USER/ftp
    allow_writeable_chroot=YES

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftp-server
  namespace: ftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ftp-server
  template:
    metadata:
      labels:
        app: ftp-server
    spec:
      containers:
        - name: ftp
          image: fauria/vsftpd
          ports:
            - containerPort: 21
            - containerPort: 30000
            - containerPort: 30009
          env:
            - name: FTP_USER
              valueFrom:
                secretKeyRef:
                  name: ftp-auth
                  key: FTP_USER
            - name: FTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ftp-auth
                  key: FTP_PASSWORD
            - name: PASV_ADDRESS
              value: "127.0.0.1"
          volumeMounts:
            - name: ftp-storage
              mountPath: /home/nexus-ftp/ftp
            - name: vsftpd-config
              mountPath: /etc/vsftpd/vsftpd.conf
              subPath: vsftpd.conf
      volumes:
        - name: ftp-storage
          persistentVolumeClaim:
            claimName: ftp-pvc
        - name: vsftpd-config
          configMap:
            name: ftp-config

---

apiVersion: v1
kind: Service
metadata:
  name: ftp-server
  namespace: ftp
spec:
  selector:
    app: ftp-server
  ports:
    - name: ftp
      port: 21
      targetPort: 21
    - name: pasv-min
      port: 30000
      targetPort: 30000
    - name: pasv-max
      port: 30009
      targetPort: 30009
  type: ClusterIP
