apiVersion: v1
kind: Namespace
metadata:
  name: ftp

---
apiVersion: v1
kind: Secret
metadata:
  name: ftp-credentials
  namespace: ftp
type: Opaque
stringData:
  FTP_USER: "nexus-ftp"
  FTP_PASSWORD: "123456789"

---
apiVersion: v1
kind: Service
metadata:
  name: ftp-server
  namespace: ftp
spec:
  selector:
    app: ftp-server
  ports:
    - name: ftp
      protocol: TCP
      port: 21
      targetPort: 21
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftp-server
  namespace: ftp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ftp-server
  template:
    metadata:
      labels:
        app: ftp-server
    spec:
      containers:
        - name: ftp
          image: stilliard/pure-ftpd:hardened
          ports:
            - containerPort: 21
          env:
            - name: PUBLICHOST
              value: "ftp-server.ftp.svc.cluster.local"
            - name: FTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: ftp-credentials
                  key: FTP_USER
            - name: FTP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: ftp-credentials
                  key: FTP_PASSWORD
            - name: FTP_USER_HOME
              value: "/home/ftpusers/nexus-ftp"
            - name: ADDED_FLAGS
              value: "--no-anonymous --ipv4"
          volumeMounts:
            - name: ftp-data
              mountPath: /home/ftpusers
      volumes:
        - name: ftp-data
          emptyDir: {}
